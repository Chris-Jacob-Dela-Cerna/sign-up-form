<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Project Orion </title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="page-container">
      <div class="hero panel">
        <div class="hero-container">
          <img class="logo" src="img/orion_premium_logo.svg" alt="Orion Premium Logo" width="150px" height="150px">
          <div class="title">
            <h1 class="project"> PROJECT </h1>
            <h2 class="orion"> RION </h2>
          </div>
        </div>
        <p class="background-credit"> Background by <a href="https://unsplash.com/@a_chosensoul" target="_blank"> A Chosen Soul </a> on <a href="https://unsplash.com/" target="_blank"> Unsplash </a></p>
      </div>

      <div class="sign-up panel">
        <ul class="links-container">
          <li class="link">
            <a class="source" href="https://github.com/Chris-Jacob-Dela-Cerna/sign-up-form" target="_blank">View Source &lt/&gt</a>
          </li>
          <li class="link">
            <a class="github" href="https://github.com/Chris-Jacob-Dela-Cerna" target="_blank">GitHub</a>
          </li>
        </ul>

        <div class="form-container">
          <div class="about pane">
            <p class="message">Our objective is to provide premium cloud services with unmatched scalability through Orion.</p>
            <p class="message">What are you waiting for? <em>Join the project.</em></p>
          </div>

          <div class="form pane">
            <h2>Register</h2>
            <form action="#">
              <div class="form-divider">
                <div class="input-container">
                  <label for="first-name">FIRST NAME</label>
                  <input id="first-name" name="first-name">
                </div>
                <div class="input-container">
                  <label>LAST NAME</label>
                  <input id="last-name" name="last-name">
                </div>
              </div>

              <div class="form-divider">
                <div class="input-container">
                  <label>EMAIL</label>
                  <input id="email" name="email">
                </div>
                <div class="input-container">
                  <label>PHONE NUMBER</label>
                  <input id="phone-number" name="phone-number">
                </div>
              </div>

              <div class="form-divider">
                <div class="input-container">
                  <label>PASSWORD</label>
                  <input id="password" name="password">
                </div>
                <div class="input-container">
                  <label>CONFIRM PASSWORD</label>
                  <input id="confirm-password" name="confirm-password">
                </div>
              </div>
            </form>
          </div>

          <div class="submit pane"></div>
        </div>
      </div>
    </div>
  </body>
</html>
